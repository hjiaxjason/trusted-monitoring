# Model roles for the trusted-monitoring pipeline.
# `backend` selects how generate.py / monitor.py dispatch calls:
#   - "hf": local transformers pipeline (free, needs a GPU with enough VRAM)
#   - "hosted": OpenAI-compatible hosted inference (Together/Fireworks), needs an API key in .env

untrusted:
  name: qwen2.5-coder-7b
  backend: hf
  model_id: Qwen/Qwen2.5-Coder-7B-Instruct
  max_new_tokens: 1024
  temperature: 0.7

trusted:
  name: qwen2.5-coder-1.5b
  backend: hf
  model_id: Qwen/Qwen2.5-Coder-1.5B-Instruct
  max_new_tokens: 256
  temperature: 0.0

# Extension A: monitor strength sweep. Each entry is scored against the same
# solution set produced by `untrusted` above.
trusted_sweep:
  - name: qwen2.5-coder-0.5b
    backend: hf
    model_id: Qwen/Qwen2.5-Coder-0.5B-Instruct
    max_new_tokens: 256
    temperature: 0.0
  - name: qwen2.5-coder-1.5b
    backend: hf
    model_id: Qwen/Qwen2.5-Coder-1.5B-Instruct
    max_new_tokens: 256
    temperature: 0.0
  - name: qwen2.5-coder-3b
    backend: hf
    model_id: Qwen/Qwen2.5-Coder-3B-Instruct
    max_new_tokens: 256
    temperature: 0.0

# Optional trusted-editing baseline (only used if that experiment is run).
trusted_editor:
  name: qwen2.5-coder-3b
  backend: hf
  model_id: Qwen/Qwen2.5-Coder-3B-Instruct
  max_new_tokens: 1024
  temperature: 0.2

name: smoke-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (CPU-only torch, no GPU on this runner)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Unit tests
        run: pytest -q

      # TODO: once scripts/01-06 are implemented (see per-file TODOs), replace
      # the step below with `scripts/run_all.sh --smoke` against the smallest
      # open models so this job exercises the real end-to-end pipeline on a
      # tiny problem subset, per PRD §6.3. Until then this workflow only
      # verifies the harness scaffolding, not the pipeline itself — keep this
      # comment until that's true, so the README badge doesn't overclaim.
